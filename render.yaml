services:
  - type: web
    name: choop-preview
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: COOKIE_SECURE
        value: "true"
      - key: READ_ONLY_PREVIEW
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: choop_preview
